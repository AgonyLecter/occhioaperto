name: Build Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'icon-512.png', 'desktop/**', '.github/workflows/desktop.yml']

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: OcchioAperto-Windows
          path: |
            desktop/dist/*.zip
            desktop/dist/*-portable.exe
          retention-days: 30
